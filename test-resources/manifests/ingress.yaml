apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: receiver
  namespace: nexus
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - pathType: ImplementationSpecific
            path: /receiver(/|$)(.*)
            backend:
              service:
                name: nexus-receiver
                port:
                  number: 8080
